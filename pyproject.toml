[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-research-auditing"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.5", "matplotlib==3.10.1"]

[project.optional-dependencies]
inference = ["torch==2.7.1", "transformers==4.51.3", "accelerate==1.6.0", "huggingface-hub==0.30.2", "safetensors==0.5.3"]

[tool.setuptools.packages.find]
include = ["auditbench*"]
